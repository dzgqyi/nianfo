/* Open Nianfo Counter — 基础样式
 * 设计原则：老年友好（大字号、大点击区、高对比）、单列纵向布局、手机优先。
 * 配色：暖灰底 + 赭红主色（修行场景，克制不喧哗）。
 */

:root {
  --bg: #f6f3ec;
  --bg-card: #fffdf8;
  --bg-sunken: #efe9dd;
  --fg: #26221c;
  --fg-soft: #6b6154;
  --fg-faint: #9a8f80;
  --accent: #9c3b2e;
  --accent-soft: #f3e2dc;
  --ok: #2f7a52;
  --ok-soft: #dfeee6;
  --warn: #a86b12;
  --warn-soft: #f7ecd6;
  --err: #b3261e;
  --line: #e2d9c9;
  --radius: 14px;
  --radius-lg: 22px;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 8px 24px rgba(60, 45, 20, .06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
    "Source Han Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17150f;
    --bg-card: #211e17;
    --bg-sunken: #100e0a;
    --fg: #f0e9dc;
    --fg-soft: #b8ac99;
    --fg-faint: #857a6a;
    --accent: #e08573;
    --accent-soft: #3a2620;
    --ok: #7fc79f;
    --ok-soft: #1c2c23;
    --warn: #dfb46a;
    --warn-soft: #2e2517;
    --err: #ef8d86;
    --line: #332e24;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body { padding-bottom: env(safe-area-inset-bottom); }

a { color: var(--accent); }

h1, h2, h3 { margin: 0 0 .4em; line-height: 1.25; }
h1 { font-size: 1.5rem; letter-spacing: .02em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; color: var(--fg-soft); font-weight: 600; }
p { line-height: 1.65; margin: 0 0 .8em; }
small { color: var(--fg-soft); }

/* ---------- 布局 ---------- */
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px calc(84px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar .brand { font-weight: 700; font-size: 1.02rem; letter-spacing: .04em; }
.topbar .spacer { flex: 1; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.row { display: flex; gap: 10px; align-items: center; }
.row.wrap-row { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }

/* ---------- 按钮 ---------- */
button, .btn {
  font: inherit;
  font-weight: 600;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--fg);
  padding: 12px 16px;
  min-height: 48px;
  cursor: pointer;
  transition: transform .06s ease, background .15s ease, border-color .15s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:active, .btn:active { transform: scale(.98); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: transparent; }
button.small { min-height: 38px; padding: 7px 12px; font-size: .86rem; font-weight: 500; }
button.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
button.block { width: 100%; }

/* ---------- 表单 ---------- */
label.field { display: block; font-size: .82rem; color: var(--fg-soft); margin-bottom: 6px; letter-spacing: .02em; }
input[type=text], input[type=number], select, textarea {
  font: inherit;
  width: 100%;
  padding: 11px 12px;
  min-height: 46px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
textarea { min-height: 96px; font-family: var(--mono); font-size: .8rem; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- 计数器主界面 ---------- */
.counter-hero {
  text-align: center;
  padding: 22px 16px 18px;
}
.count-num {
  font-size: clamp(4rem, 24vw, 7rem);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  margin: 4px 0 6px;
  color: var(--fg);
  transition: color .2s ease;
}
.count-num.bump { color: var(--accent); }
.count-sub { color: var(--fg-soft); font-size: .95rem; font-variant-numeric: tabular-nums; }

.progress {
  height: 10px;
  border-radius: 999px;
  background: var(--bg-sunken);
  overflow: hidden;
  margin: 16px 0 8px;
}
.progress > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--warn)));
  border-radius: 999px;
  transition: width .3s ease;
}

.tapgate {
  display: grid;
  place-items: center;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 状态灯 ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .78rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--fg-soft);
  white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--accent-soft); color: var(--err); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--bg-card) 94%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1;
  border: 0;
  background: transparent;
  border-radius: 0;
  min-height: 56px;
  padding: 8px 4px;
  font-size: .72rem;
  font-weight: 600;
  color: var(--fg-faint);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.tabbar button[aria-current=page] { color: var(--accent); }
.tabbar .ico { font-size: 1.15rem; line-height: 1; }

/* ---------- 列表 ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
}
.list-item.active { border-color: var(--accent); background: var(--accent-soft); }
.list-item .t { font-weight: 600; }
.list-item .d { font-size: .78rem; color: var(--fg-soft); font-variant-numeric: tabular-nums; }

/* ---------- 日志 ---------- */
.log {
  font-family: var(--mono);
  font-size: .72rem;
  line-height: 1.55;
  max-height: 300px;
  overflow: auto;
  background: var(--bg-sunken);
  border-radius: var(--radius);
  padding: 10px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ---------- 柱状图 ---------- */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.bars .bar { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--accent); opacity: .85; min-height: 2px; }
.bars .lab { font-size: .62rem; color: var(--fg-faint); }

/* ---------- 提示条 ---------- */
.note {
  font-size: .82rem;
  line-height: 1.6;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: var(--warn-soft);
  color: color-mix(in srgb, var(--warn) 70%, var(--fg));
}
.note.info { background: var(--bg-sunken); color: var(--fg-soft); }

/* ---------- 步骤列表（连接失败的「下一步」） ---------- */
.steps {
  margin: 0;
  padding-left: 1.35em;
  font-size: .84rem;
  line-height: 1.7;
  color: var(--fg-soft);
}
.steps li { margin: 2px 0; }
.steps li::marker { color: var(--accent); font-weight: 700; }

/* ---------- 键值表（环境细节） ---------- */
.kv {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 0;
  border-bottom: 1px dashed var(--line);
  font-size: .78rem;
}
.kv:last-of-type { border-bottom: 0; }
.kv > span { color: var(--fg-soft); }
.kv > code { font-size: .76rem; text-align: right; word-break: break-all; }

/* 紧密列表：每条都值得读时不要留大空隙 */
ul.tight { margin: 0; padding-left: 1.2em; font-size: .85rem; line-height: 1.65; }
ul.tight li { margin: 4px 0; }

/* ---------- 点按跳转（帮助里指路用） ---------- */
.linkish {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.kbd {
  font-family: var(--mono);
  font-size: .78em;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--bg-card);
}

.hidden { display: none !important; }
.center { text-align: center; }
.muted { color: var(--fg-soft); }
code { font-family: var(--mono); font-size: .86em; }


/* 组件与弹窗补充样式（与 styles.css 一起打包） */

/* ---------- 应用外壳 ---------- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.appbar .title { font-weight: 700; font-size: 1rem; }
.appbar .title small { font-weight: 500; color: var(--fg-faint); margin-left: 6px; }

.page { display: none; }
.page.active { display: block; }

/* ---------- 计数器主卡 ---------- */
.hero-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 0;
  overflow: hidden;
  margin-bottom: 12px;
}
.hero-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 0;
}
.hero-head .name { font-weight: 700; font-size: 1.05rem; }
.hero-body { padding: 4px 16px 18px; text-align: center; }

/* 计数按钮：整块可点，避免小按钮难按 */
.tap-area {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 260px;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 10px 0 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow: hidden;
  isolation: isolate;
}
.tap-area:active { background: color-mix(in srgb, var(--bg-sunken) 55%, transparent); }
.tap-area .ripple {
  position: absolute;
  z-index: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  opacity: .75;
  pointer-events: none;
  animation: ripple .5s ease-out forwards;
}
@keyframes ripple {
  from { width: 24px; height: 24px; opacity: .7; }
  to { width: 260px; height: 260px; opacity: 0; }
}

.count-num { margin: 0; }

.meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
}
.meta-cell {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 6px;
  text-align: center;
}
.meta-cell .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.02rem; }
.meta-cell .k { font-size: .68rem; color: var(--fg-faint); margin-top: 2px; letter-spacing: .06em; }

.stepper { display: flex; gap: 8px; }
.stepper button { flex: 1; }

/* ---------- 设备条形 ---------- */
.device-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  border-radius: var(--radius);
  border: 1px dashed var(--line);
  background: transparent;
  font-size: .84rem;
  color: var(--fg-soft);
}
.device-bar.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); background: var(--ok-soft); color: var(--ok); }
.device-bar .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 弹窗 ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(20, 16, 10, .45);
  display: grid;
  place-items: center;
  padding: 18px;
  animation: fade .16s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  width: min(520px, 100%);
  max-height: 86vh;
  overflow: auto;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  padding: 20px;
}
.modal-card h2 { font-size: 1.1rem; margin-bottom: .5em; }
.field-group { margin-bottom: 14px; }
.field-group > label.field { margin-bottom: 6px; display: block; }
.scope-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.scope-list li label { display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.scope-list input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(76px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  z-index: 80;
  background: var(--fg);
  color: var(--bg);
  font-size: .86rem;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  max-width: 86vw;
  text-align: center;
}
.toast.show { opacity: .95; transform: translate(-50%, 0); }

/* ---------- 表格 ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: .84rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--fg-faint); font-weight: 600; font-size: .74rem; letter-spacing: .04em; }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 窄屏上四列表格会挤成一团，允许横向滑动而不是压缩字 */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table-wrap .tbl { min-width: 480px; }
.table-wrap .tbl td:last-child { min-width: 150px; }

/* ---------- 其它 ---------- */
.chip {
  display: inline-block;
  font-size: .72rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--fg-soft);
  font-family: var(--mono);
}
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.switch-row:last-child { border-bottom: 0; }
.switch-row .lbl { font-size: .92rem; }
.switch-row .desc { font-size: .76rem; color: var(--fg-faint); margin-top: 2px; line-height: 1.45; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--bg-sunken); border: 1px solid var(--line);
  transition: background .18s ease;
}
.switch span::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .18s ease;
}
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }

details.acc { border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; margin-bottom: 8px; background: var(--bg); }
details.acc > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: .9rem; list-style: none; display: flex; align-items: center; gap: 8px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: '▸'; color: var(--fg-faint); transition: transform .15s; }
details.acc[open] > summary::before { transform: rotate(90deg); }
details.acc .acc-body { padding-bottom: 12px; }

.mono { font-family: var(--mono); }

/* 三列按钮在窄屏会被挤成两行，缩短文案并允许自动换行 */
.hero-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hero-actions button { padding: 10px 6px; font-size: .88rem; white-space: nowrap; }
.right { margin-left: auto; }

</style>
</head>
